    <script>
        (function() {
            // ====== 拦截 #app 路由 ======
            function blockAppRoute() {
                if (window.location.hash === '#app') {
                    history.replaceState(null, document.title, window.location.pathname + window.location.search);
                }
            }
            blockAppRoute();
            window.addEventListener('hashchange', blockAppRoute);

            var origPush = history.pushState;
            var origReplace = history.replaceState;
            history.pushState = function() {
                var r = origPush.apply(this, arguments);
                setTimeout(blockAppRoute, 0);
                return r;
            };
            history.replaceState = function() {
                var r = origReplace.apply(this, arguments);
                setTimeout(blockAppRoute, 0);
                return r;
            };

            // ====== 页面定制 ======
            function customize() {
                var app = document.querySelector('#app');
                if (!app || !app.children.length) return;

                // 1. 替换文字
                function replaceText(root, from, to) {
                    var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null, false);
                    var nodes = [];
                    while (walker.nextNode()) {
                        if (walker.currentNode.textContent && walker.currentNode.textContent.indexOf(from) !== -1) {
                            nodes.push(walker.currentNode);
                        }
                    }
                    for (var i = 0; i < nodes.length; i++) {
                        nodes[i].textContent = nodes[i].textContent.split(from).join(to);
                    }
                }
                replaceText(app, '网络面板', '测速面板');

                // 2. 隐藏"关于"按钮
                var btns = app.querySelectorAll('button');
                for (var j = 0; j < btns.length; j++) {
                    if (btns[j].textContent.trim() === '关于' || btns[j].classList.contains('home')) {
                        btns[j].style.display = 'none';
                    }
                }

                // 3. 隐藏底部版权/赞助区域（包含 Whoami/源码/IP离线库/CDN/括彩 等关键词）
                // 收集底部的链接容器
                var allLinks = app.querySelectorAll('.el-link, a[href]');
                for (var k = 0; k < allLinks.length; k++) {
                    var txt = allLinks[k].textContent.trim();
                    if (txt === 'Whoami' || txt === '源码' || txt === 'IP离线库' || 
                        txt.indexOf('Edgeone') > -1 || txt.indexOf('CDN') > -1 ||
                        txt.indexOf('括彩') > -1 || txt.indexOf('Tencent') > -1) {
                        var container = allLinks[k].parentElement;
                        while (container && container !== app) {
                            var cText = container.textContent.trim();
                            // 如果容器包含"提供CDN服务"或"特别感谢"等关键词，隐藏整个容器
                            if (cText.indexOf('提供CDN服务') > -1 || 
                                cText.indexOf('特别感谢') > -1 ||
                                cText.indexOf('本工具由') > -1 ||
                                (cText.indexOf('Whoami') > -1 && cText.indexOf('源码') > -1)) {
                                container.style.display = 'none';
                                break;
                            }
                            container = container.parentElement;
                        }
                    }
                }

                // 4. 额外保险：直接隐藏包含"本工具由"或"提供CDN服务"的元素
                var allDivs = app.querySelectorAll('div, p, span');
                for (var m = 0; m < allDivs.length; m++) {
                    var dText = allDivs[m].textContent.trim();
                    if ((dText.indexOf('本工具由') > -1 || dText.indexOf('提供CDN服务') > -1 || dText.indexOf('特别感谢') > -1) 
                        && allDivs[m].children.length <= 10) {
                        allDivs[m].style.display = 'none';
                    }
                }
            }

            // 轮询等待渲染
            var cnt = 0;
            var timer = setInterval(function() {
                cnt++;
                try { customize(); } catch(e) {}
                if (cnt > 20) clearInterval(timer);
            }, 200);

            // DOM 变化时重新应用
            var mutTimer = null;
            var observer = new MutationObserver(function() {
                if (mutTimer) clearTimeout(mutTimer);
                mutTimer = setTimeout(function() {
                    try { customize(); } catch(e) {}
                }, 100);
            });
            observer.observe(document.body, { childList: true, subtree: true });
        })();
    </script>

            if (e.key === 'theme') {
                savedTheme = e.newValue;
                applyTheme();
            }
